<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friends Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', Arial, sans-serif;}

    body{
      min-height:100vh;display:flex;justify-content:center;align-items:center;
      background:radial-gradient(circle at top left,#ff2f8b55,transparent 35%),
      radial-gradient(circle at bottom right,#00d4ff55,transparent 35%),
      linear-gradient(135deg,#020617,#1b1b4d,#3b0a57);
      overflow:hidden;color:white;padding:20px;
    }

    body::before{content:"";position:absolute;width:500px;height:500px;background:#ff2f8b;border-radius:50%;filter:blur(130px);top:-150px;left:-150px;opacity:0.7;}
    body::after{content:"";position:absolute;width:500px;height:500px;background:#00d4ff;border-radius:50%;filter:blur(130px);bottom:-150px;right:-150px;opacity:0.7;}

    .login-wrapper{position:relative;z-index:2;width:100%;max-width:460px;}

    .login-box{
      background:rgba(255,255,255,0.12);backdrop-filter:blur(22px);
      border:1px solid rgba(255,255,255,0.25);border-radius:28px;
      padding:45px 35px;box-shadow:0 0 50px rgba(255,47,139,0.35),
      inset 0 0 30px rgba(255,255,255,0.05);text-align:center;
    }

    .login-icon{
      width:85px;height:85px;margin:0 auto 20px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;font-size:38px;
      background:linear-gradient(135deg,#ff2f8b,#00d4ff);
      box-shadow:0 0 35px rgba(0,212,255,0.8);
    }

    .login-box h1{font-size:30px;font-weight:900;margin-bottom:10px;text-shadow:0 0 18px #ff4fa3;}
    .subtitle{color:#dbeafe;margin-bottom:28px;font-size:15px;}

    .input-group{margin-bottom:16px;}
    .input-group-text{background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.35);color:white;border-radius:14px 0 0 14px;}
    .form-control{padding:15px;background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.35);color:white;border-radius:0 14px 14px 0;}
    .form-control::placeholder{color:#eeeeee;}
    .form-control:focus{background:rgba(255,255,255,0.22);color:white;border-color:#00d4ff;box-shadow:0 0 18px rgba(0,212,255,0.8);}

    .login-btn{
      width:100%;padding:15px;margin-top:10px;border:none;border-radius:16px;
      font-size:18px;font-weight:900;color:white;
      background:linear-gradient(45deg,#ff2f8b,#ff7b00);
      box-shadow:0 0 28px rgba(255,47,139,0.8);transition:0.3s;
    }

    .login-btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 0 45px rgba(255,123,0,1);}
    #message{color:#ffdddd;margin-top:18px;font-weight:800;min-height:24px;}

    .back-home{display:inline-block;margin-top:20px;color:#dbeafe;text-decoration:none;font-weight:600;}
    .back-home:hover{color:#00d4ff;}
  </style>
</head>

<body>

  <div class="login-wrapper">
    <div class="login-box">
      <div class="login-icon">
        <i class="bi bi-heart-fill"></i>
      </div>

      <h1>❤️ Friends Forever Memories ❤️</h1>
      <p class="subtitle">Only special friends can enter this memory world</p>

      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
        <input id="username" type="email" class="form-control" placeholder="Enter Email">
      </div>

      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
        <input id="password" type="password" class="form-control" placeholder="Enter Password">
      </div>

      <button class="login-btn" onclick="login()">
        <i class="bi bi-box-arrow-in-right"></i> Login
      </button>

      <p id="message"></p>

      <a href="index.html" class="back-home">
        <i class="bi bi-arrow-left-circle"></i> Back to Home
      </a>
    </div>
  </div>

  <script type="module">
    import { auth } from "./firebase.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    window.login = async function () {
      let email = document.getElementById("username").value.trim();
      let password = document.getElementById("password").value.trim();
      let message = document.getElementById("message");

      if (email === "" || password === "") {
        message.innerText = "Email aur password bharo.";
        return;
      }

      message.innerText = "Logging in...";

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);

        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("username", userCredential.user.email);

        message.innerText = "Login Successful ✅";

        setTimeout(() => {
          window.location.href = "admin.html";
        }, 800);

      } catch (error) {
        message.innerText = "Wrong email or password";
      }
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
